titel_nl=Waarnemingen %%200%%
message_nl=Meestal loop ik met een grote telelens rond om foto's te maken van vogels en diertjes. Maar naast de camera, heb ik ook een telefoon met een lensje, waar makkelijk voor planten.  Waarneming.nl is erg aantrekkelijk om de soorten te determineren, vooral door de automatische soortherkenning en de handmatige controle door moderators. Veel van de foto's komen toch van mijn grote camera. <p>Normaal gebruik ik een blog voor 1 dag, maar voor dit project dat loopt over jaren gebruik ik maanden.</p>
titel_en=Observations %%200%%
message_en=Usually I walk around with a big telephoto lens to take pictures of birds and animals. But besides the camera, I also have a phone with a lens, which is easy for plants. Waarneming.nl is very attractive to determine the species, especially because of the automatic species recognition and the manual check by moderators. Many of the photos come from my big camera. <p>Normally I use a blog for 1 day, but for this project that runs over years I use months.</p>